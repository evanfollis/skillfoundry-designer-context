[repository]
schema_version = "1"
name = "Designer Context"
agent_id = "designer"

[frontdoor]
pinned_paths = [
  'README.md',
  'memory/mission.md',
  'memory/profiles/designer.md',
  'memory/findings/candidate_screen.md',
  'memory/decisions/first_external_product_candidate.md',
  'memory/plans/launchpad_lint_design_loop.md'
]
discoverable_paths = ['bundles', 'memory', 'artifacts']

[promotion_policy]
promotable_memory_roots = ['profiles', 'notes', 'plans', 'findings', 'decisions']
required_validation_kinds = ['canon-safe', 'frontdoor-reviewed', 'design-coherent']
